<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenWrt 登录检测</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f1117;color:#e0e0e0;min-height:100vh}
.container{max-width:900px;margin:0 auto;padding:20px}
h1{text-align:center;margin-bottom:24px;font-size:22px;color:#7eb8ff}
.card{background:#1a1d27;border-radius:12px;padding:20px;margin-bottom:16px;border:1px solid #2a2d3a}
label{display:block;font-size:13px;color:#888;margin-bottom:6px}
textarea,input{width:100%;background:#12141c;border:1px solid #2a2d3a;border-radius:8px;color:#e0e0e0;padding:10px 12px;font-size:14px;font-family:"SF Mono","Fira Code",monospace}
textarea{height:160px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:#7eb8ff}
.row{display:flex;gap:12px;margin-bottom:12px}
.row>*{flex:1}
.btn{display:block;width:100%;padding:12px;background:linear-gradient(135deg,#4a7dff,#7eb8ff);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(74,125,255,.3)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.stop{background:linear-gradient(135deg,#ff4a4a,#ff8e8e)}
.stats{display:flex;gap:12px;margin-bottom:12px}
.stat{flex:1;background:#12141c;border-radius:8px;padding:12px;text-align:center}
.stat .num{font-size:28px;font-weight:700}
.stat.success .num{color:#4ade80}
.stat.fail .num{color:#f87171}
.stat.total .num{color:#7eb8ff}
.progress-bar{height:4px;background:#2a2d3a;border-radius:2px;margin-bottom:12px;overflow:hidden}
.progress-bar .fill{height:100%;background:linear-gradient(90deg,#4a7dff,#7eb8ff);transition:width .3s}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#12141c;padding:10px;text-align:left;font-weight:600;color:#888;border-bottom:1px solid #2a2d3a;position:sticky;top:0}
td{padding:10px;border-bottom:1px solid #1e2130}
tr:hover td{background:#1e2130}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600}
.badge.ok{background:#064e3b;color:#4ade80}
.badge.no{background:#7f1d1d;color:#f87171}
.hidden{display:none}
.hint{font-size:12px;color:#666;margin-top:4px}
#copyBtn{background:#2a2d3a;color:#7eb8ff;border:1px solid #3a3d4a;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;margin-top:8px}
#copyBtn:hover{background:#3a3d4a}
.result-table{max-height:500px;overflow-y:auto}
.new-row{animation:flashIn .5s}
@keyframes flashIn{from{background:#1a3a2a}to{background:transparent}}
.running-indicator{display:inline-block;width:8px;height:8px;background:#4ade80;border-radius:50%;margin-right:6px;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.backend-url{background:#12141c;border:1px solid #2a2d3a;border-radius:8px;padding:10px 12px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.backend-url label{margin:0;white-space:nowrap;font-size:13px}
.backend-url input{border:none;background:transparent;color:#7eb8ff;font-size:13px;flex:1;padding:0}
.backend-url input:focus{outline:none}
</style>
</head>
<body>
<div class="container">
  <h1>🔗 OpenWrt 路由器批量登录检测</h1>

  <div class="card">
    <div class="backend-url">
      <label>🖥 后端地址:</label>
      <input type="text" id="backendUrl" placeholder="http://192.168.100.130:5678" value="">
    </div>
    <label>目标列表（IP:端口，每行一个）</label>
    <textarea id="targets" placeholder="192.168.1.1:80&#10;192.168.1.100:8080&#10;10.0.0.1:80"></textarea>
    <div class="hint">支持 HTTP 端口，每行一个地址</div>
  </div>

  <div class="card">
    <div class="row">
      <div><label>用户名</label><input type="text" id="username" placeholder="root" value="root"></div>
      <div><label>密码</label><input type="password" id="password" placeholder="密码"></div>
    </div>
    <div class="row">
      <div><label>超时（秒）</label><input type="number" id="timeout" value="8" min="3" max="30"></div>
      <div><label>并发数</label><input type="number" id="workers" value="20" min="1" max="100"></div>
    </div>
  </div>

  <button class="btn" id="startBtn" onclick="startCheck()">🚀 开始检测</button>

  <div id="resultArea" class="hidden" style="margin-top:16px">
    <div class="card">
      <div class="progress-bar"><div class="fill" id="progressFill" style="width:0%"></div></div>
      <div class="stats">
        <div class="stat total"><div class="num" id="doneCount">0</div><div>已检测</div></div>
        <div class="stat success"><div class="num" id="successCount">0</div><div>✅ 成功</div></div>
        <div class="stat fail"><div class="num" id="failCount">0</div><div>❌ 失败</div></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <span id="runStatus"></span>
        <button id="copyBtn" onclick="copySuccess()" class="hidden">📋 复制成功列表</button>
      </div>
    </div>
    <div class="card">
      <div class="result-table">
        <table><thead><tr><th>#</th><th>IP:端口</th><th>状态</th><th>方式</th><th>详情</th></tr></thead><tbody id="resultBody"></tbody></table>
      </div>
    </div>
  </div>
</div>

<script>
let running=false,evtSource=null,successList=[];

function getBackend(){
  let u=document.getElementById("backendUrl").value.trim();
  if(!u){u=location.origin;document.getElementById("backendUrl").value=u;}
  return u.replace(/\/+$/,'');
}

async function startCheck(){
  if(running){stopCheck();return;}
  const targets=document.getElementById("targets").value.trim();
  const username=document.getElementById("username").value.trim();
  const password=document.getElementById("password").value;
  const timeout=document.getElementById("timeout").value;
  const workers=document.getElementById("workers").value;
  if(!targets)return alert("请输入目标列表");
  if(!username)return alert("请输入用户名");

  running=true;successList=[];
  document.getElementById("resultBody").innerHTML="";
  ["doneCount","successCount","failCount"].forEach(id=>document.getElementById(id).textContent="0");
  document.getElementById("progressFill").style.width="0%";
  document.getElementById("resultArea").classList.remove("hidden");
  document.getElementById("copyBtn").classList.add("hidden");
  document.getElementById("runStatus").innerHTML='<span class="running-indicator"></span>检测中...';
  const btn=document.getElementById("startBtn");
  btn.textContent="⏹ 停止";btn.classList.add("stop");

  try{
    const base=getBackend();
    const resp=await fetch(base+"/api/check",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({targets,username,password,timeout,workers})});
    const data=await resp.json();
    if(data.error){alert(data.error);stopCheck();return;}

    evtSource=new EventSource(base+"/api/stream/"+data.task_id);
    let rowNum=0;
    evtSource.onmessage=function(e){
      const r=JSON.parse(e.data);
      if(r.type==="done"){stopCheck();return;}
      rowNum++;
      const tbody=document.getElementById("resultBody");
      const tr=document.createElement("tr");tr.className="new-row";
      const cls=r.status==="success"?"ok":"no";
      const label=r.status==="success"?"✅ 成功":"❌ 失败";
      tr.innerHTML=`<td>${rowNum}</td><td>${r.ip}</td><td><span class="badge ${cls}">${label}</span></td><td>${r.method}</td><td>${r.detail}</td>`;
      if(r.status==="success"){
        const ff=tbody.querySelector("tr:not(.success-row)");
        if(ff)tbody.insertBefore(tr,ff);else tbody.appendChild(tr);
        tr.classList.add("success-row");successList.push(r.ip);
      }else tbody.appendChild(tr);
      document.getElementById("doneCount").textContent=r.progress;
      document.getElementById("successCount").textContent=r.success_count;
      document.getElementById("failCount").textContent=r.fail_count;
      document.getElementById("progressFill").style.width=Math.round(r.progress/r.total*100)+"%";
    };
    evtSource.onerror=function(){if(running)stopCheck();};
  }catch(e){alert("请求失败: "+e.message);stopCheck();}
}

function stopCheck(){
  running=false;
  if(evtSource){evtSource.close();evtSource=null;}
  document.getElementById("startBtn").textContent="🚀 开始检测";
  document.getElementById("startBtn").classList.remove("stop");
  document.getElementById("runStatus").innerHTML="✅ 检测完成";
  if(successList.length>0)document.getElementById("copyBtn").classList.remove("hidden");
}

function copySuccess(){
  navigator.clipboard.writeText(successList.join("\n")).then(()=>{
    const b=document.getElementById("copyBtn");b.textContent="✅ 已复制!";setTimeout(()=>b.textContent="📋 复制成功列表",2000);
  });
}

// 自动填充后端地址
if(!document.getElementById("backendUrl").value)document.getElementById("backendUrl").value=location.origin;
</script>
</body>
</html>
